name: Publish to GitHub Pages

# The site is served from the gh-pages branch (Settings → Pages).
# This workflow keeps gh-pages in sync: every push to main republishes the app.
# No build step needed — Tandem is plain HTML/CSS/JS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
